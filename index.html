<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BFP Fire Safety Adventure</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#0f172a;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
max-width:560px;
margin:auto;
padding:12px;
}

.card{
background:#1e293b;
border:1px solid #334155;
border-radius:20px;
padding:14px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.logo{
font-size:20px;
font-weight:900;
}

.small{
font-size:12px;
color:#cbd5e1;
}

.progress{
height:8px;
background:#334155;
border-radius:8px;
overflow:hidden;
margin-top:10px;
}

.progress div{
height:100%;
background:#fbbf24;
width:0;
transition:.3s;
}

.scene{
position:relative;
height:330px;
border-radius:18px;
overflow:hidden;
margin-top:10px;
background:linear-gradient(
#93c5fd 0 55%,
#84cc16 55% 66%,
#475569 66%
);
}

.sun{
position:absolute;
right:28px;
top:25px;
font-size:42px;
}

.house{
position:absolute;
left:12%;
bottom:48px;
width:76%;
height:220px;
background:#e2e8f0;
border:6px solid #334155;
}

.roof{
position:absolute;
left:-12px;
top:-48px;
width:calc(100% + 24px);
height:55px;
background:#b91c1c;
clip-path:polygon(50% 0,100% 100%,0 100%);
}

.window{
position:absolute;
width:55px;
height:55px;
background:#fde68a;
border:5px solid #334155;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

.w1{
left:12%;
top:27%;
}

.w2{
right:12%;
top:27%;
}

.w3{
left:12%;
bottom:12%;
}

.w4{
right:12%;
bottom:12%;
}

.door{
position:absolute;
left:43%;
bottom:0;
width:65px;
height:105px;
background:#7c2d12;
border:5px solid #334155;
display:flex;
align-items:flex-start;
justify-content:center;
padding-top:8px;
}

.smoke{
position:absolute;
font-size:40px;
opacity:.65;
animation:smoke 1s infinite alternate;
}

.s1{
left:37%;
top:42px;
}

.s2{
left:50%;
top:25px;
}

.s3{
left:59%;
top:52px;
}

.fire{
position:absolute;
font-size:48px;
animation:fire .35s infinite alternate;
}

.f1{
left:19%;
top:115px;
}

.f2{
right:19%;
top:145px;
}

.hero{
position:absolute;
bottom:28px;
left:7%;
font-size:48px;
transition:.7s;
}

@keyframes fire{
to{
transform:scale(1.18) rotate(4deg);
}
}

@keyframes smoke{
to{
transform:translateY(-12px);
}
}

.sceneText{
position:absolute;
left:10px;
top:10px;
background:#0f172dcc;
border-radius:12px;
padding:8px 10px;
font-size:12px;
font-weight:800;
z-index:2;
}

.question{
margin-top:10px;
font-size:17px;
font-weight:800;
line-height:1.3;
}

.options{
display:grid;
gap:9px;
margin-top:12px;
}

button{
min-height:54px;
border:0;
border-radius:14px;
padding:10px 12px;
font-weight:800;
font-size:14px;
background:#f8fafc;
color:#0f172a;
}

button:active{
transform:scale(.98);
}

button:disabled{
opacity:.45;
}

.primary{
background:#fbbf24;
}

.safe{
background:#86efac;
}

.wrong{
background:#fecaca;
}

.feedback{
margin-top:10px;
padding:12px;
border-radius:14px;
background:#0f172a;
line-height:1.4;
font-size:14px;
}

.next{
margin-top:10px;
width:100%;
display:none;
}

.badges{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:10px;
}

.badge{
background:#334155;
border-radius:20px;
padding:6px 9px;
font-size:12px;
}

.overlay{
position:absolute;
inset:0;
background:#0f172aef;
display:none;
align-items:center;
justify-content:center;
padding:22px;
text-align:center;
z-index:5;
}

.overlayBox{
background:#f8fafc;
color:#0f172a;
border-radius:20px;
padding:24px;
width:92%;
}

.overlayBox button{
width:100%;
margin-top:12px;
background:#fbbf24;
}

@media(max-width:360px){

.scene{
height:300px;
}

.house{
height:195px;
}

.question{
font-size:16px;
}

}
</style>
</head>

<body>

<div class="app">

<div class="card">

<div class="top">

<div>

<div class="logo">
🚒 BFP FIRE SAFETY ADVENTURE
</div>

<div class="small" id="stage">
Mission 1 of 6
</div>

</div>

<div>
⭐ <b id="score">0</b>
</div>

</div>

<div class="progress">
<div id="prog"></div>
</div>

</div>


<div class="scene" id="scene">

<div class="sun">
☀️
</div>

<div class="sceneText" id="sceneText">
FIRE SAFETY: MAKE THE SAFE CHOICE
</div>


<div class="house">

<div class="roof"></div>

<div class="window w1">
🔥
</div>

<div class="window w2">
👤
</div>

<div class="window w3">
👤
</div>

<div class="window w4">
🔥
</div>

<div class="door">
🚪
</div>

</div>


<div class="smoke s1">
💨
</div>

<div class="smoke s2">
💨
</div>

<div class="smoke s3">
💨
</div>


<div class="fire f1">
🔥
</div>

<div class="fire f2">
🔥
</div>


<div class="hero" id="hero">
🧒
</div>


<div class="overlay" id="overlay">

<div class="overlayBox">

<h2 id="ovTitle">
🏆
</h2>

<p id="ovText" style="margin-top:8px">
</p>

<button id="ovBtn">
CONTINUE
</button>

</div>

</div>

</div>


<div class="card">

<div class="question" id="question">
</div>

<div class="options" id="options">
</div>

<div class="feedback" id="feedback">
Choose what you think is the safest action.
</div>

<button class="next primary" id="next">
➡️ NEXT MISSION
</button>

<div class="badges" id="badges">
</div>

</div>

</div>


<script>

(() => {

const missions=[

{
title:"Smoke alarm",
scene:"Smoke Alarm",

q:"🔔 The smoke alarm is making a loud sound. What should you do?",

a:[

[
"Hide under the bed",
"wrong",
"Hiding can make it harder for rescuers to find you."
],

[
"Tell an adult and get outside safely",
"safe",
"Correct! A smoke alarm is a warning. Alert an adult and evacuate."
],

[
"Turn off the alarm and keep playing",
"wrong",
"Do not ignore a fire alarm."
]

]

},


{
title:"Smoke",
scene:"Inside the house",

q:"💨 There is smoke in the hallway. What is the safer way to move?",

a:[

[
"Stand tall and run",
"wrong",
"Smoke can make breathing difficult and can be dangerous."
],

[
"Stay low and move toward a safe exit",
"safe",
"Correct! Stay low in smoke and move toward a safe exit."
],

[
"Hide in a closet",
"wrong",
"Do not hide during a fire. Get out and call for help."
]

]

},


{
title:"Hot door",
scene:"Bedroom",

q:"🚪 You touch a closed door and it feels hot. What should you do?",

a:[

[
"Open it quickly",
"wrong",
"A hot door may mean fire is on the other side."
],

[
"Do not open it; use another safe exit if available",
"safe",
"Correct! Do not open a hot door. Find another safe way out."
],

[
"Go back to sleep",
"wrong",
"A hot door is a serious warning."
]

]

},


{
title:"Clothing fire",
scene:"Stop • Drop • Roll",

q:"🔥 Your clothes catch fire. What should you do?",

a:[

[
"Run faster",
"wrong",
"Running can make the flames burn more strongly."
],

[
"STOP, DROP, and ROLL",
"safe",
"Correct! Stop, drop to the ground, and roll to help put out the flames."
],

[
"Hide under a blanket",
"wrong",
"Use Stop, Drop, and Roll and get adult help."
]

]

},


{
title:"Elevator",
scene:"Apartment",

q:"🛗 There is a fire in the building. Which should you use to evacuate?",

a:[

[
"Elevator",
"wrong",
"Do not use elevators during a fire unless directed by trained authorities."
],

[
"Stairs and a safe exit",
"safe",
"Correct! Use the stairs and follow the evacuation route."
],

[
"Go back inside for your toys",
"wrong",
"Never go back inside for belongings."
]

]

},


{
title:"Firefighter",
scene:"Fire scene",

q:"🚒 You see a fire. You are a child. What is your job?",

a:[

[
"Go inside and fight the fire",
"wrong",
"Children should not enter a burning building or fight the fire."
],

[
"Get to a safe place, tell an adult, and call for emergency help",
"safe",
"Correct! Get out, stay out, alert an adult, and get emergency help."
],

[
"Watch the fire from near the building",
"wrong",
"Stay well away from the fire and smoke."
]

]

}

];


let i=0;

let score=0;

let answered=false;


const $=id=>document.getElementById(id);


function render(){

const m=missions[i];

$("stage").textContent=
`Mission ${i+1} of ${missions.length}`;

$("prog").style.width=
((i)/missions.length*100)+"%";

$("score").textContent=score;

$("sceneText").textContent=m.scene;

$("question").textContent=m.q;

$("feedback").textContent=
"Choose what you think is the safest action.";

$("next").style.display="none";

answered=false;

$("options").innerHTML="";


m.a.forEach((item,n)=>{

const b=document.createElement("button");

b.textContent=
String.fromCharCode(65+n)+". "+item[0];

b.addEventListener("click",()=>answer(b,item));

$("options").appendChild(b);

});


$("badges").innerHTML="";


if(i===1){

$("hero").style.left="18%";

}

if(i===2){

$("hero").style.left="30%";

}

if(i===3){

$("hero").style.left="42%";

}

if(i===4){

$("hero").style.left="52%";

}

if(i===5){

$("hero").textContent="👨‍🚒";

$("hero").style.left="65%";

}

}


function answer(btn,item){

if(answered)return;

answered=true;


document
.querySelectorAll("#options button")
.forEach(x=>x.disabled=true);


const text=item[0];

const type=item[1];

const explain=item[2];


if(type==="safe"){

score+=100;

btn.classList.add("safe");

$("feedback").innerHTML=
"✅ <b>Tama!</b> "+explain;

$("badges").innerHTML=
'<span class="badge">🏅 SAFE CHOICE</span>';

}else{

score=Math.max(0,score-25);

btn.classList.add("wrong");

$("feedback").innerHTML=
"⚠️ <b>Hindi ito ang safest choice.</b> "+explain;

$("badges").innerHTML=
'<span class="badge">💡 LEARN & TRY AGAIN</span>';

}


$("score").textContent=score;

$("next").style.display="block";

}


function next(){

if(!answered)return;


if(i<missions.length-1){

i++;

render();

}else{

$("ovTitle").textContent=
"🏆 JUNIOR FIRE SAFETY HERO";

$("ovText").innerHTML=
"You completed all 6 fire-safety missions!"+
"<br><br>"+
"<b>Score: "+score+"</b>"+
"<br><br>"+
"Remember: <b>Get out. Stay out. Tell an adult. Get emergency help.</b>";

$("ovBtn").textContent=
"PLAY AGAIN";

$("overlay").style.display="flex";

}

}


$("next").addEventListener(
"click",
next
);


$("ovBtn").addEventListener(
"click",
()=>{

i=0;

score=0;

$("overlay").style.display="none";

render();

}
);


render();

})();

</script>

</body>
</html>
