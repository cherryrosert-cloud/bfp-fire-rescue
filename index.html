<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BFP Fire Safety Adventure</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#0f172a;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
max-width:560px;
margin:auto;
padding:12px;
}

.card{
background:#1e293b;
border:1px solid #334155;
border-radius:20px;
padding:14px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.logo{
font-size:20px;
font-weight:900;
}

.small{
font-size:12px;
color:#cbd5e1;
}

.progress{
height:8px;
background:#334155;
border-radius:8px;
overflow:hidden;
margin-top:10px;
}

.progress div{
height:100%;
background:#fbbf24;
width:0;
transition:.3s;
}

.scene{
position:relative;
height:330px;
border-radius:18px;
overflow:hidden;
margin-top:10px;
background:linear-gradient(
#93c5fd 0 55%,
#84cc16 55% 66%,
#475569 66%
);
}

.sun{
position:absolute;
right:28px;
top:25px;
font-size:42px;
}

.house{
position:absolute;
left:12%;
bottom:48px;
width:76%;
height:220px;
background:#e2e8f0;
border:6px solid #334155;
}

.roof{
position:absolute;
left:-12px;
top:-48px;
width:calc(100% + 24px);
height:55px;
background:#b91c1c;
clip-path:polygon(50% 0,100% 100%,0 100%);
}

.window{
position:absolute;
width:55px;
height:55px;
background:#fde68a;
border:5px solid #334155;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

.w1{
left:12%;
top:27%;
}

.w2{
right:12%;
top:27%;
}

.w3{
left:12%;
bottom:12%;
}

.w4{
right:12%;
bottom:12%;
}

.door{
position:absolute;
left:43%;
bottom:0;
width:65px;
height:105px;
background:#7c2d12;
border:5px solid #334155;
display:flex;
align-items:flex-start;
justify-content:center;
padding-top:8px;
}

.smoke{
position:absolute;
font-size:40px;
opacity:.65;
animation:smoke 1s infinite alternate;
}

.s1{
left:37%;
top:42px;
}

.s2{
left:50%;
top:25px;
}

.s3{
left:59%;
top:52px;
}

.fire{
position:absolute;
font-size:48px;
animation:fire .35s infinite alternate;
}

.f1{
left:19%;
top:115px;
}

.f2{
right:19%;
top:145px;
}

.hero{
position:absolute;
bottom:28px;
left:7%;
font-size:48px;
transition:.7s;
}

@keyframes fire{
to{
transform:scale(1.18) rotate(4deg);
}
}

@keyframes smoke{
to{
transform:translateY(-12px);
}
}

.sceneText{
position:absolute;
left:10px;
top:10px;
background:#0f172dcc;
border-radius:12px;
padding:8px 10px;
font-size:12px;
font-weight:800;
z-index:2;
}

.question{
margin-top:10px;
font-size:17px;
font-weight:800;
line-height:1.3;
}

.options{
display:grid;
gap:9px;
margin-top:12px;
}

button{
min-height:54px;
border:0;
border-radius:14px;
padding:10px 12px;
font-weight:800;
font-size:14px;
background:#f8fafc;
color:#0f172a;
}

button:active{
transform:scale(.98);
}

button:disabled{
opacity:.45;
}

.primary{
background:#fbbf24;
}

.safe{
background:#86efac;
}

.wrong{
background:#fecaca;
}
